# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: nestjs CI

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
      - uses: actions/checkout@v5
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - name: npm install and test
        run: |
          npm install
          npm test
        env:
          CI: true

  deploy:
    needs: [test]
    runs-on: ubuntu-latest
    # Две выкатки подряд не идут одновременно (вторая ждёт первую)
    concurrency:
      group: deploy-ozon
      cancel-in-progress: false

    steps:
      - name: SSH and deploy trade app
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          command_timeout: 30m
          script: |
            set -euo pipefail
            export NVM_DIR=~/.nvm
            source ~/.nvm/nvm.sh
            cd ~/ozon
            git pull origin main
            # Сторож на время сборки останавливается: nest build стирает dist, и сторож перезапускал ozon
            # на пустую папку (25.10.2026 — 16 падений, pm2 errored, ozon стоял 32 минуты)
            pm2 stop ozon-watchdog || true
            npm ci
            npm run build
            test -f dist/main.js
            pm2 restart ozon --update-env
            # Ждём, пока поднимется: /api отвечает 200, иначе выкатка считается неудачной.
            # Старт Nest на магазине — 2–3 минуты (HNSW-индекс, SKU площадок); 26.10.2026 ждали
            # минуту, деплой «упал», сторож остался выключенным и админка не пересобралась.
            for i in $(seq 1 100); do
              if curl -sf -m 3 "http://127.0.0.1:${APP_PORT:-3002}/api" >/dev/null; then echo "ozon up"; break; fi
              if [ "$i" = 100 ]; then echo "ozon did not come up"; pm2 logs ozon --lines 50 --nostream; exit 1; fi
              sleep 3
            done
            pm2 delete ozon-watchdog || true
            pm2 start "npx ts-node tools/watchdog.ts" --name ozon-watchdog
            # Админка собирается после того, как сервис уже поднят
            cd ~/ozon/admin-panel
            npm ci
            npm run build
